[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcommons"
version = "0.1.0"
description = "Open evidence for choosing software capabilities"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema>=4.21",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
benchmark = [
  "pdfplumber>=0.11,<0.12",
  "PyMuPDF>=1.26,<1.27",
  "camelot-py>=1.0,<2.1",
  "reportlab>=4.0,<5"
]

[project.scripts]
toolcommons = "toolcommons.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
